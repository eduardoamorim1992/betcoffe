<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANÁLISE · modelo de Poisson</title>
<style>
  html, body { margin: 0; background: #0C0F14; }
  #root { min-height: 100vh; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel fixado na v7: a v8 usa o runtime automático de JSX (import de
     "react/jsx-runtime") e quebra o setup UMD/global. A v7 usa React.createElement. -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const C = {
  bg:"#0C0F14", bg2:"#10141B", card:"#151A22", cardHi:"#1B212B",
  line:"#222A35", line2:"#2D3744",
  txt:"#E9EDF3", txt2:"#9AA5B6", txt3:"#67738A",
  green:"#1BD17C", greenDim:"#0F8C56", red:"#F0455B", redDim:"#A8324A",
  gold:"#E7A93C", blue:"#5C8DF0",
};
const MONO="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace";
const DISP="'Space Grotesk', ui-sans-serif, system-ui, sans-serif";
const BODY="'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif";

// Base do proxy: usa /api quando a página é servida pelo server.py (http/https);
// se aberta direto via file://, fala com o servidor local em http://localhost:8000.
const API_PORT = 8000;
const API_BASE = location.protocol.indexOf("http") === 0
  ? "/api"
  : "http://localhost:" + API_PORT + "/api";

/* ── matemática ── */
function fact(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function pois(k,l){ return Math.exp(-l)*Math.pow(l,k)/fact(k); }
const fmtBRL=(n)=>(n<0?"-":"")+Math.abs(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=(p)=>(p*100).toFixed(1)+"%";
const fairOdd=(p)=> p>0 ? (1/p).toFixed(2) : "—";

function analisar(lh, la){
  const MAX=10;
  let pH=0,pD=0,pA=0, btts=0;
  const over={1.5:0,2.5:0,3.5:0};
  const scores=[];
  for(let i=0;i<=MAX;i++){
    for(let j=0;j<=MAX;j++){
      const p=pois(i,lh)*pois(j,la);
      if(i>j)pH+=p; else if(i===j)pD+=p; else pA+=p;
      const t=i+j;
      [1.5,2.5,3.5].forEach(x=>{ if(t>x) over[x]+=p; });
      if(i>0&&j>0) btts+=p;
      scores.push({i,j,p});
    }
  }
  scores.sort((a,b)=>b.p-a.p);
  return { pH,pD,pA, over, under:{1.5:1-over[1.5],2.5:1-over[2.5],3.5:1-over[3.5]},
    bttsY:btts, bttsN:1-btts, top:scores.slice(0,5), golsEsp:lh+la };
}

/* ── app ── */
function App(){
  // tenta puxar a banca do outro sistema (mesmo navegador)
  let bancaInit=1000;
  try{ const c=JSON.parse(localStorage.getItem("banca:config")); if(c&&c.bancaInicial) bancaInit=c.bancaInicial; }catch(e){}

  const [inp,setInp]=useState({
    casa:"Mandante", fora:"Visitante",
    gfH:1.6, gaH:0.9, gfA:1.1, gaA:1.4,
    ligaMedia:1.35, vantCasa:1.10,
  });
  const [odds,setOdds]=useState({ um:"", x:"", dois:"", ov25:"", un25:"", bttsY:"", bttsN:"" });
  const [banca,setBanca]=useState(bancaInit);
  const [kFrac,setKFrac]=useState(0.25);

  // ── API-Football (via proxy local) ──
  const [apiKey,setApiKey]=useState(()=>{ try{ return localStorage.getItem("apifootball:key")||""; }catch(e){ return ""; } });
  const [busca,setBusca]=useState({ casa:"", fora:"" });
  const [lastN,setLastN]=useState(10);
  const [apiBusy,setApiBusy]=useState(false);
  const [apiMsg,setApiMsg]=useState(null); // {type:"ok"|"err"|"info", text}

  const up=(k,v)=>setInp(s=>({...s,[k]:v}));
  const upOdd=(k,v)=>setOdds(s=>({...s,[k]:v}));
  const num=(v)=>{ const n=parseFloat(v); return isFinite(n)?n:0; };

  const saveKey=(v)=>{ setApiKey(v); try{ localStorage.setItem("apifootball:key",v); }catch(e){} };

  async function apiGet(path){
    const headers={};
    if(apiKey) headers["x-apisports-key"]=apiKey;
    let r;
    try{ r=await fetch(API_BASE+path,{headers}); }
    catch(e){ throw new Error("não consegui falar com o proxy local. O server.py está rodando?"); }
    let j={};
    try{ j=await r.json(); }catch(e){}
    if(!r.ok){
      const det=j&&j.errors ? (typeof j.errors==="string"?j.errors:JSON.stringify(j.errors)) : ("HTTP "+r.status);
      throw new Error(det);
    }
    return j;
  }

  // busca o time pelo nome e calcula médias dos últimos N jogos finalizados
  async function statsTime(nome){
    const ts=await apiGet("/teams?search="+encodeURIComponent(nome));
    const arr=(ts&&ts.response)||[];
    if(!arr.length) throw new Error('time não encontrado: "'+nome+'"');
    const team=arr[0].team;
    const fx=await apiGet("/fixtures?team="+team.id+"&last="+lastN);
    const games=((fx&&fx.response)||[]).filter(g=>{
      const st=g.fixture&&g.fixture.status&&g.fixture.status.short;
      return st==="FT"||st==="AET"||st==="PEN";
    });
    if(!games.length) throw new Error("sem jogos finalizados para "+team.name);
    let gf=0,ga=0;
    games.forEach(g=>{
      const emCasa=g.teams.home.id===team.id;
      const gh=(g.goals.home==null?0:g.goals.home);
      const gv=(g.goals.away==null?0:g.goals.away);
      gf+= emCasa?gh:gv;
      ga+= emCasa?gv:gh;
    });
    const n=games.length;
    return { name:team.name, gf:gf/n, ga:ga/n, n };
  }

  async function buscarMedias(){
    if(!apiKey.trim()){ setApiMsg({type:"err",text:"informe a chave da API-Football."}); return; }
    if(!busca.casa.trim() && !busca.fora.trim()){ setApiMsg({type:"err",text:"digite o nome de pelo menos um time."}); return; }
    setApiBusy(true); setApiMsg({type:"info",text:"buscando na API-Football…"});
    try{
      const upd={}; const partes=[];
      if(busca.casa.trim()){
        const h=await statsTime(busca.casa.trim());
        upd.casa=h.name; upd.gfH=+h.gf.toFixed(2); upd.gaH=+h.ga.toFixed(2);
        partes.push(h.name+": "+h.n+"j · "+h.gf.toFixed(2)+" mar / "+h.ga.toFixed(2)+" sof");
      }
      if(busca.fora.trim()){
        const a=await statsTime(busca.fora.trim());
        upd.fora=a.name; upd.gfA=+a.gf.toFixed(2); upd.gaA=+a.ga.toFixed(2);
        partes.push(a.name+": "+a.n+"j · "+a.gf.toFixed(2)+" mar / "+a.ga.toFixed(2)+" sof");
      }
      setInp(s=>({...s,...upd}));
      setApiMsg({type:"ok",text:"✓ "+partes.join("   ·   ")});
    }catch(e){
      setApiMsg({type:"err",text:"erro: "+e.message});
    }finally{
      setApiBusy(false);
    }
  }

  const res=useMemo(()=>{
    const L=num(inp.ligaMedia)||1.35;
    const lhBase=(num(inp.gfH)*num(inp.gaA))/L;
    const laBase=(num(inp.gfA)*num(inp.gaH))/L;
    const hav=num(inp.vantCasa)||1;
    const lh=Math.max(0.05, lhBase*hav);
    const la=Math.max(0.05, laBase*(2-hav>0?(2-hav):0.9));
    return { lh,la, ...analisar(lh,la) };
  },[inp]);

  // mercados com prob do modelo
  const mercados=[
    {key:"um",   nome:"Vitória "+inp.casa,  p:res.pH},
    {key:"x",    nome:"Empate",             p:res.pD},
    {key:"dois", nome:"Vitória "+inp.fora,  p:res.pA},
    {key:"ov25", nome:"Mais de 2.5 gols",   p:res.over[2.5]},
    {key:"un25", nome:"Menos de 2.5 gols",  p:res.under[2.5]},
    {key:"bttsY",nome:"Ambas marcam: Sim",  p:res.bttsY},
    {key:"bttsN",nome:"Ambas marcam: Não",  p:res.bttsN},
  ];

  const palpites=mercados.map(m=>{
    const O=parseFloat(odds[m.key]);
    if(!(O>1)) return {...m, O:null};
    const edge=m.p*O-1;
    const kelly=(m.p*O-1)/(O-1);
    const frac=Math.max(0,kelly)*kFrac;
    return {...m, O, edge, kelly, stake:banca*frac};
  });
  const comValor=palpites.filter(p=>p.O&&p.edge>0).sort((a,b)=>b.edge-a.edge);

  return (
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:BODY,color:C.txt}}>
      <style>{CSS}</style>
      <div className="wrap">
        <a href="index.html" style={{
            display:"inline-flex", alignItems:"center", gap:6, textDecoration:"none",
            color:C.txt2, fontFamily:BODY, fontSize:12.5, border:`1px solid ${C.line}`,
            background:C.bg2, borderRadius:8, padding:"5px 11px", marginBottom:14,
            transition:"color .15s, border-color .15s",
          }}
          onMouseEnter={(e)=>{ e.currentTarget.style.color=C.gold; e.currentTarget.style.borderColor=C.gold; }}
          onMouseLeave={(e)=>{ e.currentTarget.style.color=C.txt2; e.currentTarget.style.borderColor=C.line; }}>
          ← Painel
        </a>
        <header className="head">
          <div className="brand"><span className="logo">◆</span> ANÁLISE
            <span className="brand-sub">modelo de Poisson</span></div>
        </header>

        <div className="aviso">
          O modelo calcula probabilidades a partir dos números que <b>você</b> inserir. Ele só aponta valor quando
          sua estimativa é melhor que a do mercado — o que é raro. <b>Não é garantia de lucro.</b>
        </div>

        {/* preencher pela API-Football */}
        <section className="panel api">
          <div className="phead"><h2>Preencher pela API-Football</h2>
            <span className="psub">requer o mini-servidor local (server.py)</span></div>

          <label className="row small" style={{marginBottom:12}}>
            <span className="rlbl">Chave x-apisports-key</span>
            <input type="password" autoComplete="off" placeholder="cole sua chave da API-Football"
              value={apiKey} onChange={e=>saveKey(e.target.value)} />
          </label>

          <div className="apirow">
            <label className="row small"><span className="rlbl">Time mandante (busca)</span>
              <input type="text" placeholder="ex.: Palmeiras" value={busca.casa}
                onChange={e=>setBusca(s=>({...s,casa:e.target.value}))}
                onKeyDown={e=>{ if(e.key==="Enter") buscarMedias(); }} /></label>
            <label className="row small"><span className="rlbl">Time visitante (busca)</span>
              <input type="text" placeholder="ex.: Flamengo" value={busca.fora}
                onChange={e=>setBusca(s=>({...s,fora:e.target.value}))}
                onKeyDown={e=>{ if(e.key==="Enter") buscarMedias(); }} /></label>
            <label className="row small lastn"><span className="rlbl">Últimos jogos</span>
              <input type="number" min="3" max="30" value={lastN}
                onChange={e=>setLastN(Math.max(1,Math.min(30,parseInt(e.target.value)||10)))} /></label>
          </div>

          <button className="apibtn" onClick={buscarMedias} disabled={apiBusy}>
            {apiBusy ? "buscando…" : "Buscar médias e preencher"}</button>

          {apiMsg && <div className={"apimsg "+apiMsg.type}>{apiMsg.text}</div>}

          <p className="apihint">As médias preenchem os campos de <b>Dados do jogo</b> abaixo (gols marcados/sofridos
          dos últimos jogos). Revise antes de confiar — o modelo continua sendo só um apoio.</p>
        </section>

        {/* entradas */}
        <section className="panel">
          <div className="phead"><h2>Dados do jogo</h2>
            <span className="psub">médias dos últimos ~6–10 jogos</span></div>

          <div className="teams">
            <div className="team">
              <input className="tname" value={inp.casa} onChange={e=>up("casa",e.target.value)} />
              <span className="thint">mandante</span>
              <Row label="Gols marcados / jogo" v={inp.gfH} on={v=>up("gfH",v)} />
              <Row label="Gols sofridos / jogo" v={inp.gaH} on={v=>up("gaH",v)} />
            </div>
            <div className="vs">×</div>
            <div className="team">
              <input className="tname" value={inp.fora} onChange={e=>up("fora",e.target.value)} />
              <span className="thint">visitante</span>
              <Row label="Gols marcados / jogo" v={inp.gfA} on={v=>up("gfA",v)} />
              <Row label="Gols sofridos / jogo" v={inp.gaA} on={v=>up("gaA",v)} />
            </div>
          </div>

          <div className="adv">
            <Row label="Média de gols na liga (por time)" v={inp.ligaMedia} on={v=>up("ligaMedia",v)} small />
            <Row label="Fator vantagem de casa" v={inp.vantCasa} on={v=>up("vantCasa",v)} small step="0.05" />
          </div>

          <div className="lambdas">
            <span>Gols esperados <b style={{color:C.gold}}>{inp.casa}</b>: <b className="mono">{res.lh.toFixed(2)}</b></span>
            <span>Gols esperados <b style={{color:C.gold}}>{inp.fora}</b>: <b className="mono">{res.la.toFixed(2)}</b></span>
            <span>Total esperado: <b className="mono">{res.golsEsp.toFixed(2)}</b></span>
          </div>
        </section>

        {/* probabilidades */}
        <section className="panel">
          <div className="phead"><h2>Probabilidades do modelo</h2>
            <span className="psub">odd justa = 1 ÷ probabilidade</span></div>

          <Grupo titulo="Resultado (1X2)" itens={[
            ["Vitória "+inp.casa, res.pH, C.green],
            ["Empate", res.pD, C.txt2],
            ["Vitória "+inp.fora, res.pA, C.blue],
          ]}/>
          <Grupo titulo="Total de gols" itens={[
            ["Mais de 1.5", res.over[1.5], C.gold],
            ["Mais de 2.5", res.over[2.5], C.gold],
            ["Mais de 3.5", res.over[3.5], C.gold],
            ["Menos de 2.5", res.under[2.5], C.txt2],
          ]}/>
          <Grupo titulo="Ambas marcam" itens={[
            ["Sim", res.bttsY, C.green],
            ["Não", res.bttsN, C.red],
          ]}/>

          <div className="placares">
            <span className="plbl">Placares mais prováveis</span>
            <div className="prow">
              {res.top.map((s,i)=>(
                <span key={i} className="pscore">
                  <b className="mono">{s.i}–{s.j}</b><em>{pct(s.p)}</em>
                </span>
              ))}
            </div>
          </div>
        </section>

        {/* valor */}
        <section className="panel">
          <div className="phead"><h2>Detector de valor</h2>
            <span className="psub">digite a odd da casa em cada mercado</span></div>

          <div className="valcfg">
            <Row label="Sua banca (R$)" v={banca} on={v=>setBanca(num(v))} small />
            <label className="kf">
              <span className="rlbl">Fração de Kelly</span>
              <select value={kFrac} onChange={e=>setKFrac(parseFloat(e.target.value))}>
                <option value={0.10}>1/10 (conservador)</option>
                <option value={0.25}>1/4 (recomendado)</option>
                <option value={0.50}>1/2 (agressivo)</option>
                <option value={1}>Kelly cheio (arriscado)</option>
              </select>
            </label>
          </div>

          <div className="vtable">
            <div className="vth"><span>Mercado</span><span>Modelo</span><span>Justa</span><span>Odd casa</span><span>Edge</span><span>Stake</span></div>
            {palpites.map(m=>(
              <div key={m.key} className={"vtr"+(m.O&&m.edge>0?" val":"")}>
                <span className="vmkt">{m.nome}</span>
                <span className="mono">{pct(m.p)}</span>
                <span className="mono dim">{fairOdd(m.p)}</span>
                <input className="oddin mono" type="number" step="0.01" placeholder="—"
                  value={odds[m.key]} onChange={e=>upOdd(m.key,e.target.value)} />
                <span className="mono" style={{color:!m.O?C.txt3:m.edge>0?C.green:C.red}}>
                  {m.O? (m.edge>=0?"+":"")+(m.edge*100).toFixed(1)+"%" : "—"}</span>
                <span className="mono" style={{color:m.O&&m.edge>0?C.gold:C.txt3}}>
                  {m.O&&m.edge>0? fmtBRL(m.stake) : "—"}</span>
              </div>
            ))}
          </div>

          <div className="palpites">
            <span className="plbl">Palpites de valor</span>
            {comValor.length===0 ? (
              <p className="muted">Nenhuma aposta de valor encontrada com essas odds. Pelo modelo, o
              melhor palpite é <b>não apostar</b> neste jogo — e isso conta como decisão correta.</p>
            ) : (
              <div className="pcards">
                {comValor.map(m=>(
                  <div key={m.key} className="pcard">
                    <div className="pc-top"><span>{m.nome}</span><span className="mono" style={{color:C.green}}>+{(m.edge*100).toFixed(1)}%</span></div>
                    <div className="pc-row">
                      <span>odd {m.O.toFixed(2)}</span>
                      <span>modelo {pct(m.p)}</span>
                      <span>stake <b style={{color:C.gold}}>{fmtBRL(m.stake)}</b></span>
                    </div>
                    {m.edge<0.05 && <span className="pc-warn">edge baixo — provavelmente dentro da margem de erro do modelo</span>}
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>

        <section className="panel notas">
          <h2>O que o modelo NÃO sabe</h2>
          <p>Ele usa só os gols que você inseriu. Não considera desfalques, lesões, suspensões, motivação,
          calendário, clima ou notícias de última hora. Odds da casa já embutem uma margem (overround), então
          edges pequenos (abaixo de ~5%) costumam ser ruído, não vantagem real. Use isto como apoio à decisão,
          não como verdade absoluta. Onde achar os números: tabela da liga, FBref, SofaScore ou Understat (médias e xG).</p>
        </section>
      </div>
    </div>
  );
}

function Row({label,v,on,small,step}){
  return (
    <label className={"row"+(small?" small":"")}>
      <span className="rlbl">{label}</span>
      <input className="mono" type="number" step={step||"0.1"} min="0" value={v}
        onChange={e=>on(e.target.value)} />
    </label>
  );
}
function Grupo({titulo,itens}){
  const max=Math.max(...itens.map(i=>i[1]),0.0001);
  return (
    <div className="grupo">
      <span className="glbl">{titulo}</span>
      {itens.map(([nome,p,cor],i)=>(
        <div key={i} className="bar">
          <span className="bname">{nome}</span>
          <div className="btrack"><div className="bfill" style={{width:(p/max*100)+"%",background:cor}}/></div>
          <span className="bp mono">{(p*100).toFixed(1)}%</span>
          <span className="bo mono">{fairOdd(p)}</span>
        </div>
      ))}
    </div>
  );
}

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box;}
::selection{background:${C.gold};color:${C.bg};}
.mono{font-family:${MONO};}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 64px;}
.head{padding-bottom:14px;}
.brand{font-family:${DISP};font-weight:700;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.logo{color:${C.gold};font-size:14px;}
.brand-sub{font-family:${BODY};font-weight:400;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${C.txt3};margin-left:4px;}
.aviso{background:rgba(231,169,60,0.08);border:1px solid ${C.line2};border-left:3px solid ${C.gold};border-radius:8px;padding:11px 13px;font-size:12.5px;color:${C.txt2};line-height:1.5;margin-bottom:18px;}
.aviso b{color:${C.txt};}
.apirow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.apirow .row{flex:1;min-width:150px;}
.apirow .lastn{flex:0 0 120px;min-width:90px;}
.api input[type=password],.api input[type=text],.api input[type=number]{background:${C.bg2};border:1px solid ${C.line2};border-radius:8px;color:${C.txt};font-size:14px;padding:8px 10px;outline:none;width:100%;}
.api input:focus-visible{border-color:${C.gold};}
.apibtn{background:${C.gold};color:${C.bg};border:none;border-radius:9px;font-family:${DISP};font-weight:600;font-size:13.5px;padding:10px 16px;cursor:pointer;transition:filter .15s;}
.apibtn:hover{filter:brightness(1.08);}
.apibtn:disabled{opacity:.55;cursor:default;}
.apimsg{margin-top:12px;font-size:12px;border-radius:8px;padding:9px 12px;line-height:1.5;font-family:${MONO};word-break:break-word;}
.apimsg.ok{background:rgba(27,209,124,0.08);border:1px solid ${C.greenDim};color:${C.green};}
.apimsg.err{background:rgba(240,69,91,0.08);border:1px solid ${C.redDim};color:${C.red};}
.apimsg.info{background:${C.bg2};border:1px solid ${C.line2};color:${C.txt2};}
.apihint{font-size:11.5px;color:${C.txt3};line-height:1.5;margin:12px 0 0;}
.apihint b{color:${C.txt2};}
.panel{background:${C.card};border:1px solid ${C.line};border-radius:14px;padding:16px;margin-bottom:16px;}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.phead h2{font-family:${DISP};font-weight:600;font-size:15px;margin:0;}
.psub{font-family:${MONO};font-size:11px;color:${C.txt3};}
.muted{color:${C.txt2};font-size:13px;line-height:1.55;}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;}
.team{display:flex;flex-direction:column;gap:8px;}
.tname{background:${C.bg2};border:1px solid ${C.line2};border-radius:8px;color:${C.txt};font-family:${DISP};font-weight:600;font-size:15px;padding:8px 10px;outline:none;}
.tname:focus-visible{border-color:${C.gold};}
.thint{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:${C.txt3};margin-top:-4px;}
.vs{font-family:${DISP};color:${C.txt3};align-self:center;padding-top:30px;}
.row{display:flex;flex-direction:column;gap:5px;}
.row.small{flex:1;}
.rlbl{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:${C.txt3};}
.row input,.valcfg input,.kf select,.adv input{background:${C.bg2};border:1px solid ${C.line2};border-radius:8px;color:${C.txt};font-size:14px;padding:8px 10px;outline:none;width:100%;}
.row input:focus-visible{border-color:${C.gold};}
.adv{display:flex;gap:14px;margin-top:14px;}
.lambdas{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid ${C.line};font-size:12px;color:${C.txt2};}
.lambdas b{font-weight:600;}
.grupo{margin-bottom:16px;}
.glbl{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:${C.txt3};margin-bottom:8px;}
.bar{display:grid;grid-template-columns:130px 1fr 56px 44px;gap:10px;align-items:center;margin-bottom:6px;}
.bname{font-size:12px;color:${C.txt2};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btrack{background:${C.bg2};border-radius:5px;height:10px;overflow:hidden;}
.bfill{height:100%;border-radius:5px;transition:width .25s;}
.bp{font-size:12px;text-align:right;}
.bo{font-size:11px;text-align:right;color:${C.txt3};}
.placares{margin-top:6px;padding-top:14px;border-top:1px solid ${C.line};}
.plbl{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:${C.txt3};margin-bottom:9px;}
.prow{display:flex;gap:8px;flex-wrap:wrap;}
.pscore{display:flex;flex-direction:column;align-items:center;gap:2px;background:${C.bg2};border:1px solid ${C.line};border-radius:8px;padding:8px 12px;}
.pscore b{font-size:14px;}
.pscore em{font-style:normal;font-size:10px;color:${C.txt3};font-family:${MONO};}
.valcfg{display:flex;gap:14px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
.kf{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px;}
.vtable{border:1px solid ${C.line};border-radius:10px;overflow:hidden;}
.vth,.vtr{display:grid;grid-template-columns:1.6fr .7fr .6fr .8fr .7fr .9fr;gap:8px;align-items:center;padding:9px 11px;}
.vth{background:${C.bg2};font-size:9px;letter-spacing:1px;text-transform:uppercase;color:${C.txt3};}
.vtr{border-top:1px solid ${C.line};font-size:12.5px;}
.vtr.val{background:rgba(27,209,124,0.06);}
.vmkt{color:${C.txt2};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dim{color:${C.txt3};}
.oddin{background:${C.bg};border:1px solid ${C.line2};border-radius:6px;color:${C.txt};font-size:12px;padding:5px 6px;width:100%;outline:none;}
.oddin:focus-visible{border-color:${C.gold};}
.palpites{margin-top:16px;}
.pcards{display:flex;flex-direction:column;gap:8px;}
.pcard{background:${C.bg2};border:1px solid ${C.greenDim};border-radius:10px;padding:11px 13px;}
.pc-top{display:flex;justify-content:space-between;font-weight:600;font-size:13px;}
.pc-row{display:flex;gap:16px;font-size:11.5px;color:${C.txt2};font-family:${MONO};margin-top:5px;}
.pc-warn{display:block;font-size:10.5px;color:${C.gold};margin-top:6px;}
.notas h2{font-family:${DISP};font-weight:600;font-size:14px;margin:0 0 8px;}
.notas p{color:${C.txt2};font-size:12.5px;line-height:1.6;margin:0;}
@media (max-width:640px){
  .teams{grid-template-columns:1fr;} .vs{display:none;}
  .bar{grid-template-columns:96px 1fr 50px 38px;}
  .vth{display:none;}
  .vtr{grid-template-columns:1fr 1fr;gap:6px 10px;}
  .vmkt{grid-column:1/3;font-weight:600;color:${C.txt};}
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
